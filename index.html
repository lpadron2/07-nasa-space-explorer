<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NASA Space Explorer</title>
  <link href="style.css" rel="stylesheet" type="text/css" />
</head>
<body>
  <div class="container">
    <header class="site-header">
      <img src="img/nasa-worm-logo.png" alt="NASA Logo" class="logo" />
      <h1>Space Explorer</h1>
    </header>

    <div class="filters">
      <input type="date" id="startDate" />
      <input type="date" id="endDate" />
      <button id="getImagesButton">Get Space Images</button>
    </div>

    <div id="gallery" class="gallery">
      <div class="placeholder">
        <div class="placeholder-icon">🔭</div>
        <p>Select a date range and click "Get Space Images" to explore the cosmos!</p>
      </div>
    </div>

    <dialog id="imageModal" class="image-modal">
      <button id="closeModalButton" class="close-modal" type="button" aria-label="Close image details">&times;</button>
      <div class="modal-scroll-content">
        <img id="modalImage" class="modal-image" alt="" />
        <video id="modalVideo" class="modal-video" controls></video>
        <h2 id="modalTitle"></h2>
        <time id="modalDate" class="image-date"></time>
        <p id="modalExplanation"></p>
      </div>
    </dialog>
  </div>

  <script src="js/dateRange.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
